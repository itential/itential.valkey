---
# Default directories
valkey_bin_dir_default: /usr/bin
valkey_conf_dir_default: /etc/valkey
valkey_log_dir_default: /var/log/valkey
valkey_data_dir_default: /var/lib/valkey

# Default ports
valkey_port_default: 6379
valkey_sentinel_port_default: 26379

# Valkey is installed via the native OS package repositories (AppStream on EL9/EL10, Amazon Linux
# 2023's own core repo). Unlike roles/redis there is no third-party repository (Remi, EPEL,
# upstream source) to check. On Rocky/AlmaLinux this still resolves to a real, checkable public
# mirror; RHEL proper resolves AppStream through its own subscription-manager CDN instead of a
# fixed public URL, and Amazon Linux 2023 ships Valkey in its already-preconfigured core repo --
# neither of those has a separate URL worth checking here. Amazon Linux reports
# ansible_os_family RedHat, so it is excluded by distribution; its major version (2023) has no
# matching Rocky AppStream mirror.
valkey_required_repositories: >-
  {{ valkey_appstream_repositories if ansible_distribution != 'Amazon' else [] }}

valkey_appstream_repositories:
  - url: "https://mirrors.rockylinux.org"
    type: path
    check_target: >-
      https://mirrors.rockylinux.org/mirrorlist?arch=x86_64&repo=AppStream-{{
      ansible_distribution_major_version }}
    notes: "Rocky/AlmaLinux 9/10 AppStream mirror for the Valkey RPM"
